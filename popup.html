
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord AI Companion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Chat AI Companion</h2>

        <p class="subtitle">
            Your private communication assistant.
        </p>

        <textarea
            id="message"
            placeholder="Paste a message here..."
        ></textarea>

        <button id="explainBtn">Explain Message</button>

        <div id="result">
            Your explanation will appear here.
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
